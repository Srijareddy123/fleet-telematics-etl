# Shared Airflow configuration applied to both webserver and scheduler
x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment:
    # Airflow core settings
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    # Empty means connections and variables are not encrypted, which is fine for a local demo.
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Airflow metadata DB (separate from our warehouse)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # ETL warehouse connection (passed to Python tasks)
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_DB: fleet_dw
    POSTGRES_USER: etl_user
    POSTGRES_PASSWORD: etl_password
    # MinIO (local stand-in for AWS S3)
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin123
    MINIO_RAW_BUCKET: etl-raw-data
    MINIO_PROCESSED_BUCKET: etl-processed
    # Python path so DAGs can import from etl/
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags          # Airflow DAG definitions
    - ./etl:/opt/airflow/etl            # Shared ETL modules
    - ./logs:/opt/airflow/logs          # Airflow task logs
    - ./plugins:/opt/airflow/plugins    # Custom Airflow plugins
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # Single Postgres instance hosts two databases:
  #   - airflow: Airflow metadata (DAG runs, task states)
  #   - etl_warehouse: Our actual data warehouse
  postgres:
    image: postgres:15-alpine
    container_name: etl_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO ─────────────────────────────────────────────────────────────────
  # Local S3-compatible object storage. Swap for AWS S3 by changing the endpoint.
  # Console UI: http://localhost:9001 (admin/minioadmin123)
  minio:
    image: minio/minio:latest
    container_name: etl_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"   # S3 API endpoint
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO bucket setup ────────────────────────────────────────────────────
  # One-time job: creates buckets and uploads sample data
  minio-setup:
    image: minio/mc:latest
    container_name: etl_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./sample_data:/sample_data
      - ./scripts:/scripts
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/etl-raw-data &&
        mc mb --ignore-existing local/etl-processed &&
        mc mb --ignore-existing local/etl-archive &&
        mc cp /sample_data/vehicle_telemetry_raw.csv local/etl-raw-data/telemetry/ &&
        mc cp /sample_data/dtc_events_raw.csv local/etl-raw-data/dtc/ &&
        mc cp /sample_data/fleet_vehicles_raw.csv local/etl-raw-data/vehicles/ &&
        echo 'MinIO setup complete, buckets created and sample data uploaded'
      "

  # ── Airflow initialisation ────────────────────────────────────────────────
  # Runs once: migrates Airflow DB and creates the admin user
  airflow-init:
    <<: *airflow-common
    container_name: etl_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
        echo "Airflow initialised: login at http://localhost:8080 (admin/admin)"
    restart: on-failure

  # ── Airflow webserver ─────────────────────────────────────────────────────
  # DAG UI: http://localhost:8080
  airflow-webserver:
    <<: *airflow-common
    container_name: etl_airflow_webserver
    command: webserver
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Airflow scheduler ─────────────────────────────────────────────────────
  # Parses DAGs and triggers task runs on schedule
  airflow-scheduler:
    <<: *airflow-common
    container_name: etl_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── FastAPI status service ────────────────────────────────────────────────
  # REST API that exposes pipeline run status from the warehouse DB
  # Docs: http://localhost:8000/docs
  fastapi:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: etl_fastapi
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: fleet_dw
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
    volumes:
      - ./api:/app   # live-reload during development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
